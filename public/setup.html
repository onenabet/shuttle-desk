<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>הגדרת מנהל ראשון</title><style>body{font-family:Arial,sans-serif;background:#f3f7f8;color:#173540;margin:0;min-height:100vh;display:grid;place-items:center}.card{background:#fff;border:1px solid #dce8e8;border-radius:18px;padding:26px;width:min(400px,90vw);box-shadow:0 12px 40px #17354011}h1{font-size:23px;margin:0 0 9px}p{color:#728994;line-height:1.5}form{display:grid;gap:12px;margin-top:22px}label{font-weight:700;font-size:12px}input{font:inherit;padding:12px;border:1px solid #d2e0e4;border-radius:9px;width:100%;box-sizing:border-box}button{font:inherit;border:0;background:#137c85;color:#fff;padding:13px;border-radius:9px;font-weight:700;cursor:pointer}#error{color:#b5483d;min-height:25px;font-size:12px}small{color:#8396a0}</style></head><body><section class="card"><h1>הגדרת מנהל ראשי</h1><p>העמוד מיועד להקמה ראשונית בלבד. דרוש קוד הקמה סודי ששמור בהגדרות השרת.</p><form id="f"><label>שם מלא</label><input name="name" required minlength="2"><label>מספר טלפון בפורמט בינלאומי</label><input name="phone" dir="ltr" type="tel" placeholder="+972501234567" required><label>סיסמה אישית (לפחות 8 תווים)</label><input name="password" type="password" required minlength="8"><label>קוד הקמה חד־פעמי</label><input name="setup" type="password" required autocomplete="off"><button type="submit">הקמת מנהל</button><div id="error" role="alert"></div></form><small>לאחר ההקמה יש למחוק את BOOTSTRAP_TOKEN מהגדרות Cloudflare.</small></section><script>document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,b=f.querySelector('button'),form=new FormData(f);b.disabled=true;b.textContent='יוצר מנהל...';try{let r=await fetch('/api/bootstrap',{method:'POST',headers:{'Content-Type':'application/json','X-Bootstrap-Token':form.get('setup')},body:JSON.stringify({name:form.get('name'),phone:String(form.get('phone')).replace(/[\s()-]/g,''),password:form.get('password')})});let d=await r.json();if(!r.ok)throw Error(d.error||'נכשלה ההקמה');document.getElementById('error').style.color='#137c85';document.getElementById('error').textContent='המנהל נוצר. אפשר להיכנס לאפליקציה.';b.textContent='בוצע';}catch(err){document.getElementById('error').textContent=err.message;b.disabled=false;b.textContent='הקמת מנהל'}})</script></body></html>
