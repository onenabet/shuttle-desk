    main{min-width:0;padding:28px 37px 50px;max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:29px}.top h1{font-size:29px;margin:0 0 7px;letter-spacing:-.5px}.muted{color:var(--sub)}.eyebrow{font-size:13px}.topright{display:flex;gap:10px;align-items:center}.profile{background:white;border:1px solid var(--line);padding:9px 13px;border-radius:12px;display:flex;align-items:center;gap:9px}.avatar{background:#d8e9eb;color:#176d73;border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-weight:700}.btn{border:0;border-radius:10px;padding:12px 17px;display:inline-flex;align-items:center;gap:8px;justify-content:center;font-weight:700;background:var(--brand);color:white;white-space:nowrap}.btn:hover{filter:brightness(.95)}.btn.secondary{background:white;color:var(--ink);border:1px solid var(--line)}.btn.ghost{background:var(--brand2);color:#0a797f}.btn.danger{background:#fbecea;color:#b5483d}.btn.sm{padding:7px 10px;font-size:12px;border-radius:8px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.metric{background:white;border-radius:15px;padding:19px 20px;border:1px solid var(--line);box-shadow:var(--shadow);min-height:122px}.metrichead{display:flex;align-items:center;justify-content:space-between;color:#697e88;font-weight:600}.metrichead i{font-style:normal;font-size:22px;background:#eff7f6;border-radius:10px;padding:7px}.metric .num{font-size:33px;font-weight:800;margin:13px 0 4px}.metric small{color:#96a5ac}.panel{background:white;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;margin-top:22px}.paneltop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:21px 22px;border-bottom:1px solid var(--line)}.paneltop h2{margin:0;font-size:18px}.paneltop p{margin:6px 0 0;font-size:12px;color:var(--sub)}.filters{display:flex;gap:9px;flex-wrap:wrap}.field,.filters select,.filters input{background:white;border:1px solid #dfe7e9;border-radius:9px;padding:10px 11px;color:var(--ink);min-height:39px}.field:focus,.filters select:focus,.filters input:focus{outline:2px solid #b0d8d8}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:right;white-space:nowrap}th{background:#f9fbfb;color:#78909a;font-size:12px;font-weight:700;padding:14px 20px}td{padding:15px 20px;border-top:1px solid #edf1f2;vertical-align:middle}td strong{display:block;margin-bottom:3px}td small{color:#90a1a9}tr:hover td{background:#fcfdfd}.badge{display:inline-flex;border-radius:100px;padding:6px 11px;font-size:12px;font-weight:700;background:#eaf2ff;color:#4c6c9e}.badge.complete{background:#e5f6e9;color:#298052}.badge.pending{background:#fff1dc;color:#ab731f}.badge.cancelled{background:#fdeaea;color:#b35b57}.badge.awaiting{background:#ecedff;color:#6e69af}.rowactions{display:flex;gap:6px}.empty{padding:38px;text-align:center;color:var(--sub)}.notice{background:#eaf5f3;color:#166d72;padding:14px 18px;border-radius:12px;margin:0 0 20px;line-height:1.7}.sectionheading{font-size:18px;margin:25px 0 14px}.twocol{display:grid;grid-template-columns:1.4fr 1fr;gap:18px}.compact{margin-top:0}.listrow{padding:14px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.listrow:last-child{border-bottom:0}.listrow small{display:block;color:var(--sub);margin-top:4px}.dot{width:8px;height:8px;background:#25b7ad;border-radius:50%;display:inline-block;margin-left:7px}.charts{display:flex;align-items:end;gap:12px;height:150px;padding:0 15px 6px}.baritem{flex:1;display:grid;align-items:end;justify-items:center;gap:8px;color:#8a9ba3;font-size:11px;height:100%}.bar{width:100%;max-width:48px;background:#a7dad6;border-radius:6px 6px 0 0;min-height:2px}.bar.em{background:#178990}.tabs{display:flex;gap:8px;margin:20px 0}.tabs button{border:1px solid var(--line);background:white;color:#65808b;padding:9px 16px;border-radius:9px}.tabs button.active{background:var(--ink);color:white}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.entitycard{border:1px solid var(--line);background:white;border-radius:14px;padding:20px;box-shadow:var(--shadow)}.entitycard h3{margin:10px 0 7px;font-size:17px}.entitycard p{margin:5px 0;color:var(--sub);line-height:1.5}.entitycard .symbol{font-size:23px;width:45px;height:45px;display:grid;place-items:center;background:#eef6f5;border-radius:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;padding:16px}.day{border:1px solid var(--line);min-height:100px;border-radius:10px;padding:10px;background:#fff}.day.today{border:2px solid var(--brand)}.day.other{opacity:.4}.day strong{font-size:12px}.day .event{background:#e7f4f3;color:#22777c;padding:5px 6px;border-radius:5px;font-size:11px;margin:6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.weekdays{display:grid;grid-template-columns:repeat(7,1fr);padding:15px 16px 0;text-align:center;color:#6f828b;font-size:12px}.reportgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.reportvalue{font-size:35px;font-weight:800;padding:20px 0}.modalback{position:fixed;inset:0;z-index:10;background:#102b36a8;display:grid;place-items:center;padding:16px}.modal{background:white;width:min(660px,100%);max-height:92vh;overflow:auto;border-radius:19px;box-shadow:0 24px 100px #06202c44}.modalhead{display:flex;align-items:center;justify-content:space-between;padding:22px 25px;border-bottom:1px solid var(--line)}.modalhead h2{margin:0;font-size:20px}.close{border:0;background:#eef3f4;border-radius:50%;width:31px;height:31px;font-size:20px}.modalbody{padding:23px 25px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.formgroup{display:grid;gap:7px}.formgroup label{font-size:12px;font-weight:700;color:#536b76}.formgroup .field{width:100%;height:43px}.formgroup.full{grid-column:1/-1}.checklist{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line);padding:12px;border-radius:10px;max-height:160px;overflow:auto}.checklist label{display:flex;align-items:center;gap:7px;padding:6px}.modalfoot{display:flex;justify-content:flex-end;gap:10px;border-top:1px solid var(--line);padding:17px 25px}.toast{position:fixed;bottom:24px;left:24px;background:#173641;color:white;padding:12px 20px;border-radius:12px;z-index:30;box-shadow:var(--shadow)}.mobilebar{display:none}.hidden{display:none!important}.footerhint{margin-top:20px;color:#8aa0a9;font-size:12px}
    @media(max-width:1100px){.grid4{grid-template-columns:repeat(2,1fr)}.twocol,.reportgrid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}main{padding:24px}}
    @media(max-width:760px){.app{display:block}.side{display:none}main{padding:20px 14px 90px}.top{align-items:flex-start;flex-direction:column;gap:15px;margin-bottom:20px}.top h1{font-size:25px}.topright{width:100%;justify-content:space-between}.grid4{gap:10px}.metric{padding:15px;min-height:105px}.metric .num{font-size:27px}.metrichead{font-size:12px}.metrichead i{font-size:17px;padding:5px}.paneltop{padding:17px}.filters{width:100%}.filters input,.filters select{flex:1;min-width:120px}.cards{grid-template-columns:1fr}.mobilebar{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);height:74px;justify-content:space-around;z-index:5;padding-bottom:env(safe-area-inset-bottom)}.mobilebar button{background:none;border:0;color:#8397a0;display:grid;justify-items:center;align-content:center;gap:4px;font-size:10px}.mobilebar button.active{color:var(--brand);font-weight:700}.mobilebar span{font-size:21px}.formgrid{grid-template-columns:1fr}.checklist{grid-template-columns:1fr}.day{padding:4px;min-height:61px}.day .event{font-size:9px;padding:3px}.calendar{gap:3px;padding:8px}.modalbody{padding:18px}.modalhead{padding:18px}.reportgrid{gap:0}}

<body class="auth-loading">
  <div class="app">
    <aside class="side"><div class="brand"><div class="brandicon">⇄</div><div><strong>ShuttleDesk</strong><small>ניהול הסעות עובדים</small></div></div><nav id="desktopNav" class="nav"></nav><div class="sidebarfoot">🟢 גרסת פיתוח פעילה<br>מצב הסנכרון מופיע בפינת המסך</div></aside>
    <main><header class="top"><div><div class="eyebrow muted" id="greeting"></div><h1 id="pageTitle">לוח בקרה</h1><div class="muted" id="pageSubtitle"></div></div><div class="topright"><select class="field" id="roleSwitch" aria-label="החלפת תצוגה"></select><button id="addTripTop" class="btn" onclick="openTrip()">＋ נסיעה חדשה</button></div></header><div id="content"></div><div class="footerhint">החלפת תפקידים היא להדגמה בלבד · כניסת נהגים והתראות Push עדיין לא פעילות</div></main>
  </div>
  <nav class="mobilebar" id="mobileNav"></nav><div id="overlay"></div><div id="toast" class="toast hidden" role="status"></div>
  <script>
    const KEY='shuttle-desk-demo-v1';const pad=n=>String(n).padStart(2,'0');const iso=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const dateAdd=(n)=>{let d=new Date();d.setDate(d.getDate()+n);return iso(d)};
    const initial=()=>({drivers:[{id:'d1',name:'יוסי כהן',phone:'050-1234567'},{id:'d2',name:'אבי לוי',phone:'052-4455667'},{id:'d3',name:'דניאל ישראלי',phone:'054-2345678'},{id:'d4',name:'משה ברק',phone:'050-8765432'},{id:'d5',name:'רון מזרחי',phone:'052-4567890'}],passengers:[{id:'p1',name:'אורן בן דוד',phone:'050-3332211',address:'רחוב הרצל 12, תל אביב'},{id:'p2',name:'דנה לוי',phone:'052-9002233',address:'דרך השלום 35, גבעתיים'},{id:'p3',name:'אלי ישראלי',phone:'054-4433221',address:'הנשיא 4, רמת גן'},{id:'p4',name:'מיכל רוזן',phone:'050-7788112',address:'ביאליק 16, רמת גן'},{id:'p5',name:'עמית כהן',phone:'052-6767676',address:'העצמאות 8, בת ים'},{id:'p6',name:'נועה ברק',phone:'054-2223344',address:'ארלוזורוב 61, תל אביב'}],destinations:['יותם','חוף','פיקוד יותם'],trips:[{id:'t1',date:iso(),time:'07:30',destination:'יותם',type:'איסוף',passengerIds:['p1','p2'],driverId:'d1',status:'complete',notes:'',ack:true},{id:'t2',date:iso(),time:'09:15',destination:'חוף',type:'פיזור',passengerIds:['p3','p4','p5'],driverId:'d2',status:'planned',notes:'',ack:false},{id:'t3',date:iso(),time:'11:30',destination:'פיקוד יותם',type:'איסוף',passengerIds:['p6'],driverId:'d3',status:'awaiting',notes:'',ack:true},{id:'t4',date:iso(),time:'14:00',destination:'יותם',type:'פיזור',passengerIds:['p1','p6'],driverId:'d4',status:'planned',notes:'',ack:false},{id:'t5',date:dateAdd(-1),time:'08:00',destination:'חוף',type:'איסוף',passengerIds:['p2','p3'],driverId:'d1',status:'complete',notes:'',ack:true},{id:'t6',date:dateAdd(-1),time:'17:00',destination:'יותם',type:'פיזור',passengerIds:['p4'],driverId:'d3',status:'cancelled',notes:'הנוסע ביטל',ack:true},{id:'t7',date:dateAdd(1),time:'08:15',destination:'פיקוד יותם',type:'איסוף',passengerIds:['p1','p5'],driverId:null,status:'planned',notes:'',ack:false}]});
    let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()};let page='dashboard',role='manager',tripFilter='today',search='',calendarOffset=0,reportPeriod='month';
    const nav=[['dashboard','◫','לוח בקרה'],['trips','▤','ניהול נסיעות'],['calendar','▦','לוח שנה'],['people','♙','נוסעים ונהגים'],['reports','▥','דוחות']];const fmt=(d)=>new Date(d+'T12:00:00').toLocaleDateString('he-IL',{day:'numeric',month:'long',year:'numeric'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}if(window.cloudSave)window.cloudSave(db);render()};const findP=id=>db.passengers.find(p=>p.id===id);const driver=id=>db.drivers.find(d=>d.id===id);const viewTrips=()=>role.startsWith('driver:')?db.trips.filter(t=>t.driverId===role.slice(7)):db.trips;const isDriver=()=>role.startsWith('driver:');const canEdit=()=>!isDriver();const statusNames={planned:'מתוכננת',awaiting:'ממתינה לאישור',complete:'בוצעה',cancelled:'בוטלה',no_show:'נוסע לא הגיע'};
    const toast=msg=>{let t=document.querySelector('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),2800)};
    function render(){let my=isDriver();document.querySelector('#desktopNav').innerHTML=nav.filter(n=>!my||['dashboard','trips','calendar'].includes(n[0])).map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span class="ico">${n[1]}</span>${n[2]}</button>`).join('');document.querySelector('#mobileNav').innerHTML=nav.filter(n=>!my||['dashboard','trips','calendar'].includes(n[0])).map(n=>`<button class="${page===n[0]?'active':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2].replace('ניהול ','')}</button>`).join('');let roles=[['manager','מנהל'],['dispatcher','סדרן'],...db.drivers.map(d=>['driver:'+d.id,'נהג: '+d.name])];document.querySelector('#roleSwitch').innerHTML=roles.map(([val,label])=>`<option value="${esc(val)}" ${role===val?'selected':''}>${esc(label)}</option>`).join('');document.querySelector('#addTripTop').classList.toggle('hidden',my);let titles={dashboard:my?'הנסיעות שלי':'לוח בקרה',trips:'ניהול נסיעות',calendar:'לוח שנה',people:'נוסעים ונהגים',reports:'דוחות וסיכומים'};document.querySelector('#pageTitle').textContent=titles[page];document.querySelector('#pageSubtitle').textContent=page==='dashboard'?'כל מה שקורה היום, במקום אחד':page==='trips'?'תכנון, שיבוץ ומעקב אחר נסיעות':page==='calendar'?'תצוגה חודשית של הנסיעות':page==='people'?'ניהול רשימות ותיקי נהגים ונוסעים':'סיכום נסיעות לפי תקופה ונהג';document.querySelector('#greeting').textContent=new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});document.querySelector('#content').innerHTML=({dashboard:renderDashboard,trips:renderTripPage,calendar:renderCalendar,people:renderPeople,reports:renderReports}[page])()}
    function go(p){page=p;render();window.scrollTo(0,0)}document.querySelector('#roleSwitch').onchange=e=>{role=e.target.value;if(isDriver()&&['people','reports'].includes(page))page='dashboard';render()};
    function metrics(trips){let total=trips.length,done=trips.filter(t=>t.status==='complete').length,pending=trips.filter(t=>t.status==='planned').length,awaiting=trips.filter(t=>t.status==='awaiting').length;return `<div class="grid4">${[['סה״כ נסיעות',total,'🚐'],['נסיעות שבוצעו',done,'✓'],['נסיעות מתוכננות',pending,'◷'],['ממתינות לאישור',awaiting,'!']].map(x=>`<div class="metric"><div class="metrichead"><span>${x[0]}</span><i>${x[2]}</i></div><div class="num">${x[1]}</div><small>לתקופה הנבחרת</small></div>`).join('')}</div>`}
    const tripRows=ts=>ts.length?`<div class="tablewrap"><table><thead><tr><th>שעה ותאריך</th><th>יעד / סוג</th><th>נוסעים</th><th>נהג</th><th>סטטוס</th><th>פעולות</th></tr></thead><tbody>${ts.map(t=>`<tr><td><strong>${esc(t.time)}</strong><small>${fmt(t.date)}</small></td><td><strong>${esc(t.destination)}</strong><small>${esc(t.type)}</small></td><td><strong>${t.passengerIds.length} נוסעים</strong><small>${esc(t.passengerIds.map(id=>findP(id)?.name||'').join(', '))}</small></td><td>${esc(driver(t.driverId)?.name||'לא שובץ')}</td><td><span class="badge ${t.status}">${statusNames[t.status]||t.status}</span>${!t.ack&&t.driverId?'<small> · לא אישר התראה</small>':''}</td><td><div class="rowactions"><button class="btn sm secondary" onclick="tripDetails('${t.id}')">פרטים</button>${canEdit()?`<button class="btn sm ghost" onclick="openTrip('${t.id}')">עריכה</button>`:''}</div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">אין נסיעות להצגה בתצוגה הזו</div>';
    function renderDashboard(){let today=viewTrips().filter(t=>t.date===iso()).sort((a,b)=>a.time.localeCompare(b.time));let future=viewTrips().filter(t=>t.date>=iso()&&t.status==='planned').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);return `${isDriver()?'<div class="notice">זו תצוגת נהג לדוגמה. כאן הנהג יכול לראות את השיבוצים שלו, לאשר קבלת התראה ולדווח על ביצוע.</div>':''}${metrics(today)}<section class="panel"><div class="paneltop"><div><h2>הנסיעות של היום</h2><p>${fmt(iso())}</p></div><button class="btn secondary sm" onclick="go('trips')">כל הנסיעות ◀</button></div>${tripRows(today)}</section><div class="twocol" style="margin-top:20px"><div class="panel compact"><div class="paneltop"><h2>הנסיעות הקרובות</h2></div>${future.length?future.map(t=>`<div class="listrow"><div><strong>${esc(t.destination)} · ${esc(t.time)}</strong><small>${fmt(t.date)} · ${esc(driver(t.driverId)?.name||'ללא נהג')}</small></div><button class="btn sm ghost" onclick="tripDetails('${t.id}')">פרטים</button></div>`).join(''):'<div class="empty">אין נסיעות קרובות</div>'}</div><div class="panel compact"><div class="paneltop"><h2>מבט על השבוע</h2></div>${chartMini()}</div></div>`}
    function chartMini(){let days=Array.from({length:7},(_,i)=>dateAdd(i-6)),counts=days.map(d=>viewTrips().filter(t=>t.date===d).length),max=Math.max(1,...counts);return `<div class="charts">${days.map((d,i)=>`<div class="baritem"><div class="bar ${d===iso()?'em':''}" style="height:${Math.max(2,counts[i]/max*105)}px" title="${counts[i]} נסיעות"></div><span>${new Date(d+'T12:00:00').toLocaleDateString('he-IL',{weekday:'short'})}</span></div>`).join('')}</div>`}
    function renderTripPage(){let ts=viewTrips().filter(t=>tripFilter==='all'||(tripFilter==='today'?t.date===iso():tripFilter==='week'?Math.abs((new Date(t.date)-new Date(iso()))/86400000)<=7:t.status===tripFilter)).filter(t=>(t.destination+' '+(driver(t.driverId)?.name||'')+' '+t.passengerIds.map(id=>findP(id)?.name).join(' ')).includes(search)).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));return `<div class="tabs">${[['today','היום'],['week','השבוע'],['all','הכול'],['awaiting','ממתינות לאישור'],['cancelled','בוטלו']].map(([v,l])=>`<button class="${tripFilter===v?'active':''}" onclick="tripFilter='${v}';render()">${l}</button>`).join('')}</div><div class="panel"><div class="paneltop"><div><h2>רשימת נסיעות</h2><p>${ts.length} נסיעות</p></div><div class="filters"><input placeholder="חיפוש נוסע, נהג, יעד..." value="${esc(search)}" oninput="search=this.value;render()"></div></div>${tripRows(ts)}</div>`}
    function renderCalendar(){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()+calendarOffset);let yr=d.getFullYear(),mo=d.getMonth(),start=(d.getDay()+0)%7,last=new Date(yr,mo+1,0).getDate();let cells=[];for(let k=0;k<Math.ceil((start+last)/7)*7;k++){let day=k-start+1,date=`${yr}-${pad(mo+1)}-${pad(day)}`,valid=day>=1&&day<=last,events=valid?viewTrips().filter(t=>t.date===date):[];cells.push(`<div class="day ${valid?'':'other'} ${date===iso()?'today':''}"><strong>${valid?day:''}</strong>${events.slice(0,3).map(t=>`<div class="event" role="button" onclick="tripDetails('${t.id}')">${t.time} ${esc(t.destination)}</div>`).join('')}${events.length>3?`<small>ועוד ${events.length-3}</small>`:''}</div>`)}return `<div class="panel" style="margin-top:0"><div class="paneltop"><h2>${d.toLocaleDateString('he-IL',{month:'long',year:'numeric'})}</h2><div class="filters"><button class="btn sm secondary" onclick="calendarOffset--;render()">❯ קודם</button><button class="btn sm secondary" onclick="calendarOffset=0;render()">היום</button><button class="btn sm secondary" onclick="calendarOffset++;render()">הבא ❮</button></div></div><div class="weekdays">${['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'].map(x=>`<b>${x}</b>`).join('')}</div><div class="calendar">${cells.join('')}</div></div>`}
    let peopleTab='passengers';function renderPeople(){let isP=peopleTab==='passengers',items=isP?db.passengers:peopleTab==='drivers'?db.drivers:db.destinations;return `<div class="tabs">${[['passengers','נוסעים'],['drivers','נהגים'],['destinations','יעדים']].map(([v,l])=>`<button class="${peopleTab===v?'active':''}" onclick="peopleTab='${v}';render()">${l}</button>`).join('')}</div><div class="panel"><div class="paneltop"><div><h2>${isP?'רשימת נוסעים':peopleTab==='drivers'?'רשימת נהגים':'יעדים קבועים'}</h2><p>${items.length} רשומות</p></div><button class="btn" onclick="openEntity()">＋ הוספה</button></div><div class="cards" style="padding:19px">${items.map((v,i)=>{let x=typeof v==='string'?{name:v}:v;return `<div class="entitycard"><div class="symbol">${isP?'♙':peopleTab==='drivers'?'🚐':'⌖'}</div><h3>${esc(x.name)}</h3>${x.phone?`<p>☎ ${esc(x.phone)}</p>`:''}${x.address?`<p>⌖ ${esc(x.address)}</p>`:''}<button class="btn ghost sm" style="margin-top:12px" onclick="openEntity('${esc(x.id||i)}')">עריכה</button></div>`}).join('')}</div></div>`}
    const inPeriod=(t)=>reportPeriod==='today'?t.date===iso():reportPeriod==='week'?(new Date(t.date+'T12:00:00')>=new Date(dateAdd(-6)+'T00:00:00')&&t.date<=iso()):t.date.slice(0,7)===iso().slice(0,7);
    function renderReports(){let ts=viewTrips().filter(inPeriod),completed=ts.filter(t=>t.status==='complete'),cancelled=ts.filter(t=>t.status==='cancelled');let countBy=fn=>{let map={};completed.forEach(t=>{let k=fn(t);map[k]=(map[k]||0)+1});return Object.entries(map).sort((a,b)=>b[1]-a[1])};return `<div class="tabs">${[['today','היום'],['week','7 ימים'],['month','החודש']].map(([v,l])=>`<button class="${reportPeriod===v?'active':''}" onclick="reportPeriod='${v}';render()">${l}</button>`).join('')}</div>${metrics(ts)}<div class="panel"><div class="paneltop"><div><h2>סיכום נסיעות</h2><p>נסיעות שבוצעו, בוטלו וממתינות לאישור</p></div><div class="filters"><button class="btn secondary sm" onclick="exportCSV()">↓ Excel / CSV</button><button class="btn secondary sm" onclick="window.print()">⎙ PDF / הדפסה</button></div></div><div class="reportgrid" style="padding:22px"><div><div class="muted">נסיעות שבוצעו</div><div class="reportvalue">${completed.length}</div><div class="muted">נסיעות שבוטלו: ${cancelled.length}</div></div><div><h3>לפי נהג</h3>${countBy(t=>driver(t.driverId)?.name||'לא שובץ').map(([k,n])=>`<div class="listrow"><span>${esc(k)}</span><strong>${n}</strong></div>`).join('')||'<p class="muted">אין נתונים</p>'}</div><div><h3>לפי יעד</h3>${countBy(t=>t.destination).map(([k,n])=>`<div class="listrow"><span>${esc(k)}</span><strong>${n}</strong></div>`).join('')||'<p class="muted">אין נתונים</p>'}</div><div><h3>לפי נוסע</h3>${(()=>{let m={};completed.forEach(t=>t.passengerIds.forEach(id=>{let k=findP(id)?.name||'לא ידוע';m[k]=(m[k]||0)+1}));return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<div class="listrow"><span>${esc(k)}</span><strong>${n}</strong></div>`).join('')||'<p class="muted">אין נתונים</p>'})()}</div></div></div>`}
    const modal=(title,body,buttons)=>{document.querySelector('#overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="modalhead"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div><div class="modalbody">${body}</div><div class="modalfoot">${buttons}</div></div></div>`};const closeModal=()=>document.querySelector('#overlay').innerHTML='';
    function openTrip(id){if(isDriver())return;let t=db.trips.find(x=>x.id===id),editing=!!t;t=t||{date:iso(),time:'08:00',destination:db.destinations[0],type:'איסוף',passengerIds:[],driverId:null,notes:''};modal(editing?'עריכת נסיעה':'יצירת נסיעה חדשה',`<form id="tripForm" class="formgrid" onsubmit="event.preventDefault();submitTrip('${id||''}')"><div class="formgroup"><label>תאריך</label><input class="field" name="date" type="date" required value="${t.date}"></div><div class="formgroup"><label>שעת נסיעה</label><input class="field" name="time" type="time" required value="${t.time}"></div><div class="formgroup"><label>יעד</label><select class="field" name="destination">${db.destinations.map(d=>`<option ${t.destination===d?'selected':''}>${esc(d)}</option>`).join('')}</select></div><div class="formgroup"><label>סוג נסיעה</label><select class="field" name="type">${['איסוף','פיזור'].map(x=>`<option ${t.type===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="formgroup"><label>נהג</label><select class="field" name="driverId"><option value="">ללא שיבוץ</option>${db.drivers.map(d=>`<option value="${d.id}" ${t.driverId===d.id?'selected':''}>${esc(d.name)}</option>`).join('')}</select></div><div class="formgroup"><label>הערות לנהג</label><input class="field" name="notes" value="${esc(t.notes)}" placeholder="הערות אופציונליות"></div><div class="formgroup full"><label>נוסעים (ניתן לבחור כמה)</label><div class="checklist">${db.passengers.map(p=>`<label><input type="checkbox" name="passengerIds" value="${p.id}" ${t.passengerIds.includes(p.id)?'checked':''}><span>${esc(p.name)}<small style="display:block;color:#8a9ba3">${esc(p.address)}</small></span></label>`).join('')}</div></div></form>`,`<button class="btn secondary" onclick="closeModal()">ביטול</button><button class="btn" onclick="document.querySelector('#tripForm').requestSubmit()">${editing?'שמירת שינויים':'יצירת נסיעה'}</button>`)}
    function submitTrip(id){let f=new FormData(document.querySelector('#tripForm')),p=f.getAll('passengerIds');if(!p.length)return toast('יש לבחור לפחות נוסע אחד');let date=f.get('date'),time=f.get('time'),driverId=f.get('driverId')||null;if(driverId&&db.trips.some(t=>t.id!==id&&t.driverId===driverId&&t.date===date&&t.time===time&&t.status!=='cancelled'))return toast('לנהג הזה קיימת נסיעה באותה שעה');let data={date,time,destination:f.get('destination'),type:f.get('type'),driverId,passengerIds:p,notes:f.get('notes')||''};if(id){let t=db.trips.find(x=>x.id===id);Object.assign(t,data);if(t.driverId!==driverId)t.ack=false}else db.trips.push({id:'t'+Date.now(),...data,status:'planned',ack:false});closeModal();save();toast(id?'הנסיעה עודכנה':'הנסיעה נוצרה')}
    function tripDetails(id){let t=db.trips.find(x=>x.id===id);if(!t)return;let readOnly=isDriver(),passengers=t.passengerIds.map((pid,i)=>{let p=findP(pid);if(!p)return'';let address=`https://waze.com/ul?q=${encodeURIComponent(p.address)}&navigate=yes`;let maps=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.address)}`;return `<div class="listrow"><div><strong>${i+1}. ${esc(p.name)}</strong><small>${esc(p.address)} · ${esc(p.phone)}</small></div><div class="rowactions"><a class="btn ghost sm" href="tel:${esc(p.phone)}">☎</a><a class="btn ghost sm" href="${address}" target="_blank" rel="noopener">Waze</a><a class="btn ghost sm" href="${maps}" target="_blank" rel="noopener">מפה</a></div></div>`}).join('');let actions=[];if(readOnly){if(!t.ack)actions.push(`<button class="btn ghost" onclick="doAction('${id}','ack')">✓ אישרתי קבלה</button>`);if(t.status==='planned')actions.push(`<button class="btn" onclick="doAction('${id}','done')">סיום נסיעה</button>`);if(t.status==='planned')actions.push(`<button class="btn secondary" onclick="doAction('${id}','no_show')">נוסע לא הגיע</button>`)}else{if(t.status==='awaiting')actions.push(`<button class="btn" onclick="doAction('${id}','approve')">✓ אישור מנהל</button>`);if(t.status!=='cancelled'&&t.status!=='complete')actions.push(`<button class="btn danger" onclick="doAction('${id}','cancel')">ביטול נסיעה</button>`);if(t.status==='planned')actions.push(`<button class="btn ghost" onclick="openTrip('${id}')">עריכת נסיעה</button>`)}modal(`נסיעה ל${esc(t.destination)}`,`<div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h3 style="margin:0">${fmt(t.date)} · ${t.time}</h3><p class="muted">${t.type} · ${esc(driver(t.driverId)?.name||'טרם שובץ נהג')}</p></div><span class="badge ${t.status}">${statusNames[t.status]}</span></div><h3>נוסעים וכתובות לפי סדר</h3>${passengers}${t.notes?`<p><strong>הערות:</strong> ${esc(t.notes)}</p>`:''}<p class="muted">אישור קבלת התראה: ${t.ack?'אושר':'טרם אושר'}</p>`,`<button class="btn secondary" onclick="closeModal()">סגירה</button>${actions.join('')}`)}
    function doAction(id,action){let t=db.trips.find(x=>x.id===id);if(!t)return;if(isDriver()){closeModal();if(window.driverAction)window.driverAction(id,action);return}if(action==='cancel'){if(role==='dispatcher')return toast('רק מנהל יכול לאשר ביטול');let reason=prompt('סיבת הביטול:');if(reason===null)return;t.cancelReason=reason;t.status='cancelled'}if(action==='ack')t.ack=true;if(action==='done')t.status='awaiting';if(action==='approve'){if(role!=='manager')return toast('אישור סופי זמין בתצוגת מנהל בלבד');t.status='complete'}if(action==='no_show')t.status='no_show';closeModal();save();toast('הסטטוס עודכן')}
    function openEntity(id){let type=peopleTab,obj=type==='destinations'?db.destinations[Number(id)]:db[type].find(x=>x.id===id),editing=id!==undefined;if(type==='destinations')obj={name:obj||''};obj=obj||{name:'',phone:'',address:''};modal(editing?'עריכת רשומה':'הוספת רשומה',`<form id="entityForm" class="formgrid" onsubmit="event.preventDefault();submitEntity('${id===undefined?'':id}')"><div class="formgroup full"><label>${type==='destinations'?'שם יעד':'שם מלא'}</label><input class="field" name="name" required value="${esc(obj.name)}"></div>${type==='destinations'?'':`<div class="formgroup full"><label>טלפון</label><input class="field" name="phone" type="tel" required value="${esc(obj.phone)}"></div>`}${type==='passengers'?`<div class="formgroup full"><label>כתובת איסוף</label><input class="field" name="address" required value="${esc(obj.address)}"></div>`:''}</form>`,`<button class="btn secondary" onclick="closeModal()">ביטול</button><button class="btn" onclick="document.querySelector('#entityForm').requestSubmit()">שמירה</button>`)}
    function submitEntity(id){let f=new FormData(document.querySelector('#entityForm')),type=peopleTab,entry={name:f.get('name'),phone:f.get('phone'),address:f.get('address')};if(type==='destinations'){if(id!=='')db.destinations[Number(id)]=entry.name;else db.destinations.push(entry.name)}else if(id){Object.assign(db[type].find(x=>x.id===id),entry)}else db[type].push({id:(type==='drivers'?'d':'p')+Date.now(),...entry});closeModal();save();toast('הרשומה נשמרה')}
    function exportCSV(){let data=viewTrips().filter(inPeriod),rows=[['תאריך','שעה','יעד','סוג','נוסעים','כתובות','טלפונים','נהג','סטטוס'],...data.map(t=>[t.date,t.time,t.destination,t.type,t.passengerIds.map(id=>findP(id)?.name).join(' / '),t.passengerIds.map(id=>findP(id)?.address).join(' / '),t.passengerIds.map(id=>findP(id)?.phone).join(' / '),driver(t.driverId)?.name||'',statusNames[t.status]])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x||'').replace(/"/g,'""')+'"').join(',')).join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='shuttle-report-'+iso()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
    window.loadCloudState=state=>{db=state;try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}render()};window.getShuttleState=()=>db;window.persistShuttle=()=>save();window.setActualRole=(value)=>{role=value;page='dashboard';render();const select=document.querySelector('#roleSwitch');select.style.display='none';let label=document.querySelector('#authenticated-role');if(!label){label=document.createElement('span');label.id='authenticated-role';label.className='profile';select.after(label)}label.textContent=value==='manager'?'מנהל':value==='dispatcher'?'סדרן':'נהג'};window.addEventListener('storage',()=>{try{db=JSON.parse(localStorage.getItem(KEY))||db;render()}catch{}});render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
  </script>
